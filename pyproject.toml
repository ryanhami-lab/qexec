[project]
name = "qexec"
version = "0.1.0"
description = "Queue-aware execution under latency and adverse selection: research replay engine (synthetic-data build)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
]

[project.scripts]
qexec = "qexec.cli.main:main"

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/qexec"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "python"
packages = ["qexec"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
# faulthandler is disabled because on Windows it prints handled SEH exceptions raised inside the
# Polars runtime as "access violation" dumps even when nothing failed.
addopts = "-q --strict-markers -p no:faulthandler"
markers = [
    "slow: long-running benchmark/integration test; excluded only by the fast pre-commit stage, always run by scripts/ci.ps1 full mode and the merge gate",
]
